# The licences this repository's Rust dependencies may carry, and where they may come from, held by
# `cargo deny check licenses sources` in gate.sh (so at every push), with the cargo-deny version the
# gate pins. The list is what the dependency graph measured on 2026-09-27 with the
# `zip` crate added to the hdtp CLI (SPEC §9.2's container), every one of them permissive; a
# dependency under any other licence fails the gate until a person has read it and added it here.
[graph]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# Every crate from crates.io and nowhere else: no git dependency, no other registry.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
